# Documentation site on the HardFOC MkDocs platform: theme, plugin and toolchain come from the hardfoc-mkdocs-theme
# package in hardfoc/hf-general-ci-tools. Preview locally:
#
#   pip install "git+https://github.com/hardfoc/hf-general-ci-tools@v1\
#   #subdirectory=packages/hardfoc-mkdocs-theme"      (one line, without the backslash)
#   git submodule update --init lib/core && git -C lib/core submodule update --init hf-core-drivers \
#     && git -C lib/core/hf-core-drivers submodule update --init internal/hf-pincfg   (the pin map and figures)
#   mkdocs serve                                     http://127.0.0.1:8000
#   mkdocs build --strict                            what CI runs
#   hardfoc-docs figures && hardfoc-docs gen         refresh figures and generated tables
#
# Pages: docs/, order: docs/.nav.yml, rules: docs/DOCS-STYLE-GUIDE.md in hf-general-ci-tools.
site_name: Vortex V1 HAL
site_description: >-
  Hardware abstraction layer for the HardFOC Vortex V1 motor controller board (ESP32-C6, TMC9660): one Vortex
  object, one manager per board function, every chip on the board.
repo_url: https://github.com/hardfoc/hf-hal-vortex-v1

# The development handbook is a submodule under docs/; it is its own site, not part of this one.
exclude_docs: |
  /hf-development-handbook/

theme:
  name: hardfoc

plugins:
  - hardfoc
  - search
  - awesome-nav
