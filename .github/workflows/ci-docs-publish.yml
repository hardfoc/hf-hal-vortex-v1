---
# Documentation site: MkDocs (Material) over docs/, the Doxygen API reference merged under api/, published to
# gh-pages with mike. Pull requests build strictly and run the figure, generated-table and link checks; a push to
# main publishes version "dev", a v* tag publishes "X.Y" and moves "latest".
#
# The workflow is hardfoc/hf-general-ci-tools ru-mkdocs-publish.yml (inputs: docs/ru-mkdocs-publish.md there).
name: 📚 Docs Publish CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    # Pinned to the branch that adds the workflow until it is merged; then switch to @main.
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-mkdocs-publish.yml@docs/mkdocs-platform
    permissions:
      contents: write  # the publish job pushes gh-pages; the build job only reads
    with:
      # The pin-map tables and figures read the pincfg header and the hf-core handlers; Doxygen needs the theme.
      submodule_paths: >-
        lib/core/hf-core-drivers/internal/hf-pincfg
        _config/doxygen-extensions/doxygen-awesome-css
      doxygen_config: _config/Doxyfile
      deploy: ${{ vars.ENABLE_GITHUB_PAGES_DEPLOY == 'true' }}
