name: "\U0001F4DD YAML Lint CI"

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  # Every pull request, including stacked ones whose base is another branch.
  pull_request:
  workflow_dispatch:

jobs:
  yamllint:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-yaml-lint.yml@main
    with:
      paths: ".github/workflows/*.yml,**/*.yml,**/*.yaml"
      config_file: "_config/.yamllint"
