name: "\U0001F50D C++ Lint CI"

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ru-cpp-lint.yml requests pull-requests: write; a called workflow can only
# receive permissions the caller grants.
permissions:
  contents: read
  pull-requests: write

jobs:
  cpp-lint:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-cpp-lint.yml@main
    with:
      clang_version: "20"
      clang_format_config: "_config/.clang-format"
      clang_tidy_config: "_config/.clang-tidy"
      extensions: "c,cpp,cc,cxx,h,hpp"
      ignore: "build|.git|third_party|vendor|lib/core/|docs/|_config/|_site/|examples/esp32/scripts/|examples/esp32/build/"
