name: "\U0001F50D C++ Analysis CI"

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  # Every pull request, including stacked ones whose base is another branch.
  pull_request:
  workflow_dispatch:

jobs:
  cppcheck:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-cpp-analysis.yml@main
    with:
      paths: "lib/managers lib/api"
      std: "c++20"
      enable: "warning,style,performance,portability,information"
