name: "\U0001F4DD Markdown Lint CI"

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  # Every pull request, including stacked ones whose base is another branch.
  pull_request:
  workflow_dispatch:

jobs:
  markdownlint:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-markdown-lint.yml@main
    with:
      globs: "docs/** *.md **/*.md"
      config_file: "_config/.markdownlint.json"
