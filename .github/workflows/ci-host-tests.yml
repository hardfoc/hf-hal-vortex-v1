---
# Host build and unit tests of the MCU-free part of the HAL (tests/host).
#
# tests/host adds lib/core (hf-core) as a subdirectory with HF_CORE_MCU=NONE and
# HF_CORE_RTOS=NONE, builds the HAL managers that do not depend on ESP-IDF, and
# runs them against hf-core's host mocks (hf_core_host_mocks). No ESP-IDF, no board.
#
# Runs on every pull request, whatever its base branch, so stacked pull requests
# are checked too.
name: "\U0001F9EA Host Tests CI"

on:
  pull_request:
  push:
    branches: [main, "release/*", "feature/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: Host build and tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # hf-core and its driver submodules; not the private handbook or CANopenNode.
      - name: Check out hf-core
        run: git submodule update --init --recursive lib/core

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure
        working-directory: tests/host
        run: cmake --preset host-debug

      - name: Build
        working-directory: tests/host
        run: cmake --build --preset host-debug

      - name: Test
        working-directory: tests/host
        run: ctest --preset host-debug
