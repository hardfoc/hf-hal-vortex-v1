name: "\U0001F517 Docs Link Check CI"

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  # Every pull request, including stacked ones whose base is another branch.
  pull_request:
  workflow_dispatch:

jobs:
  linkcheck:
    uses: hardfoc/hf-general-ci-tools/.github/workflows/ru-docs-linkcheck.yml@main
    with:
      paths: "docs/** *.md **/*.md"
      config_file: "_config/lychee.toml"
