<title id="manager-dependencies-title">Managers, handlers and drivers</title>
<desc id="manager-dependencies-desc">Graph from each manager to the hf-core handlers it uses and from each handler to the chip driver it wraps; the TMC9660 handler is shared by the motor, GPIO, ADC and temperature managers.</desc>
