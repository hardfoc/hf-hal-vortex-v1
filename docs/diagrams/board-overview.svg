<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#3730A3">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#17202C">Vortex V1: buses and chips</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Every GPIO, expander pin, SPI mode and I2C address below is read from the pin map and the comms manager.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<path d="M266 167.8 L628 167.8" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-blue-strong)"/>
<path d="M266 209.8 L628 209.8" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-blue-strong)"/>
<path d="M266 292.8 L628 292.8" fill="none" stroke="#0F8B80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-teal-strong)"/>
