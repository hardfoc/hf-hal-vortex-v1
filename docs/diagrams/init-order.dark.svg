<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="671" viewBox="0 0 1200 671" role="img" aria-labelledby="init-order-title init-order-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="init-order-title">Vortex::EnsureInitialized()</title>
<desc id="init-order-desc">Initialisation order: NvsManager, CommChannelsManager, GpioManager, LedManager are required; then MotorController, AdcManager, ImuManager, EncoderManager, TemperatureManager are best effort and only produce warnings if they fail.</desc>
<defs><marker id="fk-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C93FF"/></marker><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker><marker id="fk-arrow-slate-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="670" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">START-UP SEQUENCE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">Vortex::EnsureInitialized()</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Managers come up one at a time, in this order. A required step that fails stops initialisation; a best-effort step that fails leaves the system running,</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">degraded.</text>
