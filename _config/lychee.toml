timeout = 30
max_retries = 3
max_redirects = 10
user_agent = "lychee/0.21.0"
accept = ["200", "429", "403"]
exclude_all_private = true

exclude = [
  '^https://www\.gnu\.org/licenses/gpl-3\.0/?$',
  '^https?://(www\.)?gnu\.org/licenses/.*',
  '^https?://img\.shields\.io/badge/License-.*',
  '^https://github\.com/hardfoc/hf-hal-vortex-v1/actions/workflows/.*',
  '^https://hardfoc\.github\.io/hf-hal-vortex-v1/.*',
  '^https://github\.com/hardfoc/hf-core-drivers.*',
  '^https://github\.com/hardfoc/hf-core-utils.*',
  # hf-development-handbook is a private repository: it is not checked out in
  # CI (update = none in .gitmodules) and returns 404 to anonymous requests.
  '^https://github\.com/hardfoc/hf-development-handbook.*',
  '/docs/hf-development-handbook/',
]

# Only check this repository's own Markdown. Submodules are checked out so that
# links into them resolve, but their documentation is checked in their own repos.
exclude_path = [
  '^lib/core/',
  '^third_party/CANopenNode/',
  '^examples/esp32/scripts/',
  '^_config/doxygen-extensions/',
  '^docs/hf-development-handbook/',
]
