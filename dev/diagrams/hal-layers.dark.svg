<title id="hal-layers-title">Vortex V1 HAL, layer by layer</title>
<desc id="hal-layers-desc">Layer stack of the Vortex V1 HAL: application, the Vortex facade, 9 managers, 5 hf-core handlers, 6 chip drivers, and the interface wrap on ESP-IDF and the ESP32-C6.</desc>
